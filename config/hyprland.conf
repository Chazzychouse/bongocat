# Bongocat overlay window rules
# Add these to your ~/.config/hypr/hyprland.conf

windowrule = float, class:^(bongocat)$
windowrule = pin, class:^(bongocat)$
windowrule = noborder, class:^(bongocat)$
windowrule = noshadow, class:^(bongocat)$
windowrule = noblur, class:^(bongocat)$
windowrule = size 128 128, class:^(bongocat)$

# Toggle visibility
bind = SUPER SHIFT, B, exec, pkill -USR2 bongocat-overlay
