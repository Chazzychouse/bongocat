# Bongocat overlay window rules
# Add these to your ~/.config/hypr/hyprland.conf

windowrule = float on, match:class ^(bongocat)$
windowrule = pin on, match:class ^(bongocat)$
windowrule = border_size 0, match:class ^(bongocat)$
windowrule = no_shadow on, match:class ^(bongocat)$
windowrule = no_blur on, match:class ^(bongocat)$
windowrule = size 128 128, match:class ^(bongocat)$

# Toggle visibility
bind = SUPER SHIFT, B, exec, pkill -USR2 bongocat-overlay
