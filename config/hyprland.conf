# Bongocat overlay window rules
# Add these to your ~/.config/hypr/hyprland.conf

windowrule = float on, match:class ^(com.github.bongocat)$
windowrule = pin on, match:class ^(com.github.bongocat)$
windowrule = border_size 0, match:class ^(com.github.bongocat)$
windowrule = no_shadow on, match:class ^(com.github.bongocat)$
windowrule = no_blur on, match:class ^(com.github.bongocat)$
windowrule = size 128 128, match:class ^(com.github.bongocat)$

# Toggle visibility — bind to a free key in your bindings.conf, e.g.:
# bind = SUPER SHIFT, B, exec, pkill -USR2 -f bongocat-overlay
